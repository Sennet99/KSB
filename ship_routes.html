// 구글 위성(hybrid) 타일: lyrs=y = 위성+라벨, lyrs=s = 위성만
// 위성 이미지는 바다가 이미 짙은 남색/검정 계열 → 항로 선명
const map = new ol.Map({
  target: 'map',
  layers: [
    new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://mt0.google.com/vt/lyrs=y&hl=ko&x={x}&y={y}&z={z}',
        attributions: '© Google Maps',
        maxZoom: 20,
        tileSize: 256
      }),
      zIndex: 0
    })
  ],
  view: new ol.View({
    center: ol.proj.fromLonLat([20, 15]),
    zoom: 3,
    minZoom: 2,
    maxZoom: 18
  })
});

function sogA(s){ return 0.15 + Math.max(0, Math.min(1,(s-SOG_MIN)/(SOG_MAX-SOG_MIN))) * 0.85; }
function sogW(s){ return 1.0  + Math.max(0, Math.min(1,(s-SOG_MIN)/(SOG_MAX-SOG_MIN))) * 2.5; }
function h2r(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

const vlayers={}, sNames=Object.keys(SHIPS_DATA), vis={};

sNames.forEach((name, idx) => {
  const col=COLORS[idx%COLORS.length], pts=SHIPS_DATA[name];
  if (!pts || pts.length < 2) return;
  const [r,g,b] = h2r(col);
  const feats = [];

  for (let i=1; i<pts.length; i++) {
    const p0=pts[i-1], p1=pts[i], sog=(p0[2]+p1[2])/2;
    const f = new ol.Feature({
      geometry: new ol.geom.LineString([
        ol.proj.fromLonLat([p0[1], p0[0]]),
        ol.proj.fromLonLat([p1[1], p1[0]])
      ]),
      sog, ship: name
    });
    f.setStyle(new ol.style.Style({
      stroke: new ol.style.Stroke({
        color: `rgba(${r},${g},${b},${sogA(sog).toFixed(3)})`,
        width: sogW(sog)
      })
    }));
    feats.push(f);
  }

  // 출항점 (원)
  const p0=pts[0];
  const sf=new ol.Feature({geometry:new ol.geom.Point(ol.proj.fromLonLat([p0[1],p0[0]])),ship:name});
  sf.setStyle(new ol.style.Style({image:new ol.style.Circle({
    radius:5, fill:new ol.style.Fill({color:col}),
    stroke:new ol.style.Stroke({color:'#fff',width:1.5})
  })}) );

  // 도착점 (삼각형)
  const pN=pts[pts.length-1];
  const ef=new ol.Feature({geometry:new ol.geom.Point(ol.proj.fromLonLat([pN[1],pN[0]])),ship:name});
  ef.setStyle(new ol.style.Style({image:new ol.style.RegularShape({
    points:3, radius:7,
    fill:new ol.style.Fill({color:col}),
    stroke:new ol.style.Stroke({color:'#fff',width:1.5})
  })}) );

  feats.push(sf, ef);

  const layer = new ol.layer.Vector({
    source: new ol.source.Vector({features: feats}),
    zIndex: 10 + idx
  });
  map.addLayer(layer);
  vlayers[name]=layer; vis[name]=true;
});

// 범례
const legend = document.getElementById('legend');
sNames.forEach((name, idx) => {
  const col=COLORS[idx%COLORS.length], pts=SHIPS_DATA[name];
  const sogs = pts ? pts.map(p=>p[2]).filter(s=>s>0.1) : [];
  const maxS = sogs.length ? Math.max(...sogs).toFixed(1) : '—';
  const div = document.createElement('div');
  div.className = 'li';
  div.innerHTML = `<div class="lline" style="background:${col}"></div><span class="lname">${name}</span>`;
  div.title = `최대 ${maxS} kn`;
  div.addEventListener('click', () => {
    vis[name] = !vis[name];
    vlayers[name].setVisible(vis[name]);
    div.classList.toggle('off', !vis[name]);
  });
  legend.appendChild(div);
});

// 툴팁
const tt = document.getElementById('tooltip');
map.on('pointermove', evt => {
  let found = null;
  map.forEachFeatureAtPixel(evt.pixel, f => {
    if (f.get('sog') !== undefined) { found=f; return true; }
  }, {hitTolerance: 6});
  if (found) {
    const sog=found.get('sog'), ship=found.get('ship');
    tt.innerHTML = `<div class="tr"><span class="tl">선박</span><span class="tv">${ship}</span></div>`
                 + `<div class="tr"><span class="tl">속도 (SOG)</span><span class="tv">${sog.toFixed(2)} kn</span></div>`;
    tt.style.display='block';
    tt.style.left=(evt.pixel[0]+14)+'px';
    tt.style.top=(evt.pixel[1]-10)+'px';
    map.getViewport().style.cursor='pointer';
  } else {
    tt.style.display='none';
    map.getViewport().style.cursor='';
  }
});
</script>
